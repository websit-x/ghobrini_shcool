<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنك الفروض والاختبارات - ثانوية غوبريني مصطفى</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-dark: #0f172a;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --telegram: #0088cc;
            --success: #16a34a;
            --danger: #dc2626;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.5; }

        header { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: white; padding: 1rem 1.5rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header-content { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 1.3rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .back-nav-btn { display: none; background: rgba(255,255,255,0.15); border: none; color: white; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .main-container { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; }
        .breadcrumb { background: white; padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 1.5rem; font-weight: 600; color: var(--text-muted); }
        .breadcrumb span { color: var(--accent); }

        .page-view { display: none; }
        .page-view.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
        .grid-item-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; text-align: center; cursor: pointer; transition: 0.2s; }
        .grid-item-card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .grid-item-card i { font-size: 2.2rem; color: var(--accent); margin-bottom: 0.8rem; }
        .grid-item-card h3 { font-size: 1.15rem; color: var(--primary-dark); }

        .trimester-tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; background: white; padding: 6px; border-radius: 10px; border: 1px solid var(--border); overflow-x: auto; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; font-weight: 700; color: var(--text-muted); border-radius: 6px; cursor: pointer; }
        .tab-btn.active { background: var(--accent); color: white; }

        .exam-item { background: var(--card-bg); border: 1px solid var(--border); border-right: 4px solid var(--telegram); border-radius: 8px; padding: 1.2rem; margin-bottom: 0.8rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .exam-info h4 { font-size: 1.1rem; color: var(--primary-dark); margin-bottom: 4px; }
        .badge { font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; }
        .badge-term { background: #e0f2fe; color: #0369a1; }
        .badge-type { background: #fef3c7; color: #b45309; }
        
        .exam-actions { display: flex; gap: 8px; }
        .btn-action { padding: 8px 14px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; border: none; color: white; display: inline-flex; align-items: center; gap: 5px; }
        .btn-telegram { background: var(--telegram); }
        .btn-delete { background: var(--danger); }

        .fab { display: none; position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: var(--telegram); color: white; border-radius: 50%; border: none; font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4); z-index: 99; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
        .modal-card { background: white; width: 100%; max-width: 500px; border-radius: 12px; padding: 1.8rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 1.5rem; }
        .btn-submit { flex: 1; padding: 10px; background: var(--telegram); color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
        .btn-cancel { padding: 10px 15px; background: #e2e8f0; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; color: var(--text); }
        
        #upload-loader { display: none; text-align: center; color: var(--telegram); font-weight: 700; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="brand"><i class="fa-brands fa-telegram"></i> بنك الفروض (تليجرام)</div>
            <button class="back-nav-btn" id="btn-back" onclick="navigateBack()"><i class="fa-solid fa-arrow-right"></i> رجوع</button>
        </div>
    </header>

    <div class="main-container">
        <div class="breadcrumb" id="breadcrumb">الرئيسية</div>

        <div id="view-year" class="page-view active">
            <div class="grid-layout">
                <div class="grid-item-card" onclick="selectYear('الأولى ثانوي')"><i class="fa-solid fa-1"></i><h3>الأولى ثانوي</h3></div>
                <div class="grid-item-card" onclick="selectYear('الثانية ثانوي')"><i class="fa-solid fa-2"></i><h3>الثانية ثانوي</h3></div>
                <div class="grid-item-card" onclick="selectYear('الثالثة ثانوي')"><i class="fa-solid fa-3"></i><h3>الثالثة ثانوي</h3></div>
            </div>
        </div>

        <div id="view-branch" class="page-view"><div class="grid-layout" id="branches-box"></div></div>
        <div id="view-subject" class="page-view"><div class="grid-layout" id="subjects-box"></div></div>
        
        <div id="view-exams" class="page-view">
            <div class="trimester-tabs">
                <button class="tab-btn active" onclick="filterTerm('الكل')">جميع الفصول</button>
                <button class="tab-btn" onclick="filterTerm('الفصل الأول')">الفصل الأول</button>
                <button class="tab-btn" onclick="filterTerm('الفصل الثاني')">الفصل الثاني</button>
                <button class="tab-btn" onclick="filterTerm('الفصل الثالث')">الفصل الثالث</button>
            </div>
            <div id="exams-container"></div>
        </div>
    </div>

    <button class="fab" id="fab-btn" onclick="openUploadModal()"><i class="fa-solid fa-paper-plane"></i></button>

    <div id="upload-modal" class="modal-overlay">
        <div class="modal-card">
            <h3><i class="fa-brands fa-telegram" style="color:var(--telegram)"></i> نشر في تليجرام</h3>
            
            <div class="form-group">
                <select id="field-term"><option value="الفصل الأول">الفصل الأول</option><option value="الفصل الثاني">الفصل الثاني</option><option value="الفصل الثالث">الفصل الثالث</option></select>
            </div>
            <div class="form-group">
                <select id="field-type"><option value="فرض">فرض</option><option value="اختبار">اختبار</option><option value="سلسلة تمارين">سلسلة تمارين</option></select>
            </div>
            <div class="form-group">
                <input type="text" id="field-desc" placeholder="عنوان الموضوع (مثال: فرض محروس رقم 1)">
            </div>
            <div class="form-group">
                <label>ملف الموضوع (صور، PDF، Word)</label>
                <input type="file" id="field-file-subj">
            </div>
            <div class="form-group">
                <label>ملف الحل</label>
                <input type="file" id="field-file-sol">
            </div>

            <div class="modal-buttons">
                <button class="btn-submit" onclick="submitToTelegram()">إرسال إلى القناة 🚀</button>
                <button class="btn-cancel" onclick="closeUploadModal()">إلغاء</button>
            </div>
            <div id="upload-loader"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري الرفع إلى خوادم تليجرام...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCu-ZLIqFgvZSEm8KSn7Seh1X9lnHhGSh0",
            authDomain: "shop-clothes-224a3.firebaseapp.com",
            projectId: "shop-clothes-224a3",
            storageBucket: "shop-clothes-224a3.appspot.com",
            messagingSenderId: "348817058494",
            appId: "1:348817058494:web:830980b3dae15984350cef"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // =====================================================================
        // إعدادات تليجرام - تم ربطها بالـ ID الخاص بك مباشرة
        // =====================================================================
        const TELEGRAM_BOT_TOKEN = "8830778195:AAGqo5LxOHUWwBa4PS6qRM5OS7hSF8aBQVg"; 
        const TELEGRAM_CHANNEL_ID = "7737717483"; // الايدي الشخصي الخاص بك
        // =====================================================================

        let navState = { year: '', branch: '', subject: '', termFilter: 'الكل' };
        let currentExamsList = [];

        const schoolCurriculum = {
            'الأولى ثانوي': { 'جذع مشترك علوم وتكنولوجيا': [{ name: 'الرياضيات', icon: 'fa-square-root-variable' }, { name: 'العلوم الفيزيائية', icon: 'fa-atom' }, { name: 'علوم الطبيعة والحياة', icon: 'fa-dna' }, { name: 'اللغة العربية وآدابها', icon: 'fa-book-open' }, { name: 'التاريخ والجغرافيا', icon: 'fa-earth-africa' }, { name: 'العلوم الإسلامية', icon: 'fa-mosque' }], 'جذع مشترك آداب': [{ name: 'اللغة العربية وآدابها', icon: 'fa-book-open' }, { name: 'التاريخ والجغرافيا', icon: 'fa-earth-africa' }, { name: 'العلوم الإسلامية', icon: 'fa-mosque' }] },
            'الثانية ثانوي': { 'علوم تجريبية': [{ name: 'علوم الطبيعة والحياة', icon: 'fa-dna' }, { name: 'العلوم الفيزيائية', icon: 'fa-atom' }, { name: 'الرياضيات', icon: 'fa-square-root-variable' }] },
            'الثالثة ثانوي': { 'علوم تجريبية': [{ name: 'علوم الطبيعة والحياة', icon: 'fa-dna' }, { name: 'العلوم الفيزيائية', icon: 'fa-atom' }, { name: 'الرياضيات', icon: 'fa-square-root-variable' }] }
        };

        window.selectYear = function(year) { navState.year = year; updateBreadcrumb(); const box = document.getElementById('branches-box'); box.innerHTML = ''; (Object.keys(schoolCurriculum[year]) || []).forEach(branch => { box.innerHTML += `<div class="grid-item-card" onclick="selectBranch('${branch}')"><i class="fa-solid fa-graduation-cap"></i><h3>${branch}</h3></div>`; }); switchView('view-branch'); document.getElementById('btn-back').style.display = 'block'; };
        window.selectBranch = function(branch) { navState.branch = branch; updateBreadcrumb(); const box = document.getElementById('subjects-box'); box.innerHTML = ''; (schoolCurriculum[navState.year][branch] || []).forEach(sub => { box.innerHTML += `<div class="grid-item-card" onclick="selectSubject('${sub.name}')"><i class="fa-solid ${sub.icon}"></i><h3>${sub.name}</h3></div>`; }); switchView('view-subject'); };
        window.selectSubject = function(subject) { navState.subject = subject; updateBreadcrumb(); switchView('view-exams'); document.getElementById('fab-btn').style.display = 'block'; fetchExamsFromDB(); };

        window.navigateBack = function() {
            if (document.getElementById('view-exams').classList.contains('active')) { switchView('view-subject'); document.getElementById('fab-btn').style.display = 'none'; }
            else if (document.getElementById('view-subject').classList.contains('active')) { switchView('view-branch'); }
            else if (document.getElementById('view-branch').classList.contains('active')) { switchView('view-year'); document.getElementById('btn-back').style.display = 'none'; navState = { year: '', branch: '', subject: '', termFilter: 'الكل' }; }
            updateBreadcrumb();
        };

        function switchView(viewId) { document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active')); document.getElementById(viewId).classList.add('active'); }
        function updateBreadcrumb() { document.getElementById('breadcrumb').innerHTML = `الرئيسية ${navState.year ? `<span>/</span> ${navState.year}` : ''} ${navState.branch ? `<span>/</span> ${navState.branch}` : ''} ${navState.subject ? `<span>/</span> ${navState.subject}` : ''}`; }

        window.openUploadModal = () => document.getElementById('upload-modal').style.display = 'flex';
        window.closeUploadModal = () => document.getElementById('upload-modal').style.display = 'none';

        async function uploadFileToTelegram(file, caption) {
            const formData = new FormData();
            formData.append('chat_id', TELEGRAM_CHANNEL_ID);
            formData.append('document', file);
            formData.append('caption', caption);

            const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument`, {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.description);
            
            const messageId = data.result.message_id;
            const channelName = String(TELEGRAM_CHANNEL_ID).replace('@', '');
            return `https://t.me/${channelName}/${messageId}`;
        }

        window.submitToTelegram = async function() {
            const term = document.getElementById('field-term').value;
            const type = document.getElementById('field-type').value;
            const desc = document.getElementById('field-desc').value;
            const fileSubj = document.getElementById('field-file-subj').files[0];
            const fileSol = document.getElementById('field-file-sol').files[0];

            if (!desc || !fileSubj || !fileSol) return alert("يرجى إدخال الوصف وإرفاق ملفات الموضوع والحل!");

            document.getElementById('upload-loader').style.display = 'block';

            try {
                const titleMeta = `📚 ${navState.subject}\n🎓 ${navState.year} - ${navState.branch}\n📌 ${type} - ${term}\n📝 ${desc}`;
                
                const subjUrl = await uploadFileToTelegram(fileSubj, `(الموضوع)\n${titleMeta}`);
                const solUrl = await uploadFileToTelegram(fileSol, `(الحل)\n${titleMeta}`);

                const docRef = await addDoc(collection(db, "exams_repository"), { 
                    year: navState.year, branch: navState.branch, subject: navState.subject, 
                    term: term, type: type, title: desc, 
                    subjectImg: subjUrl, solutionImg: solUrl, 
                    timestamp: serverTimestamp() 
                });
                
                let myDocs = JSON.parse(localStorage.getItem('my_school_exams') || '[]'); myDocs.push(docRef.id); localStorage.setItem('my_school_exams', JSON.stringify(myDocs));
                
                alert("تم النشر بنجاح! الملفات الآن محفوظة في حسابك الشخصي."); 
                closeUploadModal(); fetchExamsFromDB();
            } catch (err) { 
                alert("خطأ في الرفع لتليجرام: " + err.message); 
            } finally { 
                document.getElementById('upload-loader').style.display = 'none'; 
            }
        };

        async function fetchExamsFromDB() {
            const container = document.getElementById('exams-container'); container.innerHTML = '<p style="text-align:center; padding:2rem;"><i class="fa-solid fa-spinner fa-spin"></i> جاري الجلب...</p>';
            try {
                const q = query(collection(db, "exams_repository"), where("year", "==", navState.year), where("branch", "==", navState.branch), where("subject", "==", navState.subject));
                const snapshot = await getDocs(q);
                currentExamsList = []; snapshot.forEach(docSnap => currentExamsList.push({ id: docSnap.id, ...docSnap.data() }));
                currentExamsList.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                renderExams();
            } catch (err) { container.innerHTML = '<p style="text-align:center; color:red;">تعذر جلب البيانات من الخادم.</p>'; }
        }

        function renderExams() {
            const container = document.getElementById('exams-container');
            let filtered = navState.termFilter !== 'الكل' ? currentExamsList.filter(e => e.term === navState.termFilter) : currentExamsList;
            if (filtered.length === 0) return container.innerHTML = '<div style="text-align:center; padding:3rem; border:1px solid var(--border); border-radius:10px; background:white;"><i class="fa-regular fa-folder-open" style="font-size:2.5rem; color:#cbd5e1; margin-bottom:10px;"></i><p style="font-weight:700; color:var(--text-muted);">لا توجد مواضيع منشورة هنا بعد.</p></div>';
            
            const myDocs = JSON.parse(localStorage.getItem('my_school_exams') || '[]');
            container.innerHTML = '';
            filtered.forEach(item => {
                container.innerHTML += `
                    <div class="exam-item">
                        <div class="exam-info">
                            <h4>${item.title}</h4>
                            <div style="display:flex; gap:5px; margin-top:5px;">
                                <span class="badge badge-term">${item.term}</span><span class="badge badge-type">${item.type}</span>
                            </div>
                        </div>
                        <div class="exam-actions">
                            <button class="btn-action btn-telegram" onclick="window.open('${item.subjectImg}', '_blank')"><i class="fa-brands fa-telegram"></i> عرض الموضوع</button>
                            <button class="btn-action btn-telegram" style="background:#16a34a;" onclick="window.open('${item.solutionImg}', '_blank')"><i class="fa-brands fa-telegram"></i> عرض الحل</button>
                            ${myDocs.includes(item.id) ? `<button class="btn-action btn-delete" onclick="deleteExam('${item.id}')"><i class="fa-solid fa-trash"></i></button>` : ''}
                        </div>
                    </div>`;
            });
        }

        window.filterTerm = function(term) { navState.termFilter = term; document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.toggle('active', btn.innerText === term || (term === 'الكل' && btn.innerText === 'جميع الفصول')); }); renderExams(); };
        window.deleteExam = async function(id) { if (confirm("ملاحظة: هذا سيحذف المنشور من الموقع فقط. لحذفه نهائياً قم بحذفه من محادثة تليجرام أيضاً. هل تريد الاستمرار؟")) { await deleteDoc(doc(db, "exams_repository", id)); currentExamsList = currentExamsList.filter(e => e.id !== id); renderExams(); } };
    </script>
</body>
</html>
