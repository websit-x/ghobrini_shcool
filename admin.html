<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة الذكية - ثانوية غوبريني مصطفى</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --admin-dark: #111827; --admin-panel: #1f2937; --admin-primary: #3b82f6; --admin-accent: #10b981; --admin-danger: #ef4444; --admin-warning: #f59e0b; --text-light: #f3f4f6; --text-muted: #9ca3af; --border-color: #374151; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--admin-dark); color: var(--text-light); line-height: 1.6; padding-bottom: 50px; }
        header { background: var(--admin-panel); padding: 1.2rem 2rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 10px; } .brand i { color: var(--admin-primary); }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
        .panel-card { background: var(--admin-panel); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; }
        .panel-header { font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; } .panel-header i { color: var(--admin-accent); }
        .form-group { margin-bottom: 1rem; } .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; background: #374151; border: 1px solid #4b5563; color: white; border-radius: 8px; font-size: 0.95rem; }
        .form-row { display: flex; gap: 10px; } .form-row .form-group { flex: 1; }
        .btn { padding: 8px 12px; border: none; border-radius: 8px; font-weight: 800; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px; color: white; transition: 0.2s; }
        .btn-submit { background: var(--admin-primary); width: 100%; margin-top: 1rem; padding: 12px; font-size: 1rem; } 
        .btn-delete { background: var(--admin-danger); } 
        .btn-approve { background: var(--admin-accent); }
        .btn-view { background: var(--admin-primary); }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; } th, td { text-align: right; padding: 10px; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; } th { background: rgba(0,0,0,0.2); color: var(--text-muted); }
        .empty-state { text-align: center; padding: 2rem; color: var(--text-muted); }
        #upload-loader { display: none; text-align: center; padding: 1rem; color: var(--admin-accent); font-weight: 700; background: rgba(16, 185, 129, 0.1); border-radius: 8px; margin-top: 1rem; border: 1px solid rgba(16, 185, 129, 0.2); }
        .hint-box { background: rgba(59, 130, 246, 0.1); border-right: 4px solid var(--admin-primary); padding: 10px; font-size: 0.85rem; border-radius: 6px; margin-bottom: 15px; color: #bfdbfe; }

        /* نافذة تفاصيل الطلب والمعاينة للأدمن */
        .admin-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 1rem; }
        .admin-modal.show { display: flex; }
        .admin-modal-card { background: var(--admin-panel); width: 100%; max-width: 700px; max-height: 90vh; border-radius: 16px; border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; }
        .admin-modal-header { padding: 1rem; background: #111827; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .admin-modal-body { padding: 1.5rem; overflow-y: auto; flex: 1; }
        .admin-modal-footer { padding: 1rem; background: #111827; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--border-color); }
        .detail-row { margin-bottom: 10px; font-size: 0.95rem; }
        .detail-row span { color: var(--text-muted); font-weight: 600; }
    </style>
</head>
<body>
    <header>
        <div class="brand"><i class="fa-solid fa-shield-halved"></i> لوحة الإدارة - ثانوية غوبريني مصطفى</div>
        <div style="font-size: 0.9rem; color: var(--admin-accent); font-weight: 700;">الأدمن: يوسف</div>
    </header>

    <div class="container">
        <!-- قسم الرفع المباشر للأدمن -->
        <div>
            <div class="panel-card">
                <div class="panel-header"><i class="fa-solid fa-layer-group"></i> رفع متعدد للمواضيع</div>
                <div class="hint-box"><i class="fa-solid fa-lightbulb"></i> حدد عدة ملفات لتسميتها ونشرها تلقائياً.</div>

                <div class="form-group"><label>السنة الدراسية</label><select id="sel-year" onchange="updateBranches()"><option value="">-- اختر السنة --</option><option value="الأولى ثانوي">الأولى ثانوي</option><option value="الثانية ثانوي">الثانية ثانوي</option><option value="الثالثة ثانوي">الثالثة ثانوي</option></select></div>
                <div class="form-group"><label>الشعبة</label><select id="sel-branch" onchange="updateSubjects()" disabled><option value="">-- اختر الشعبة --</option></select></div>
                <div class="form-group"><label>المادة</label><select id="sel-subject" disabled><option value="">-- اختر المادة --</option></select></div>
                <div class="form-row">
                    <div class="form-group"><label>الفصل</label><select id="sel-term"><option value="الفصل الأول">الفصل الأول</option><option value="الفصل الثاني">الفصل الثاني</option><option value="الفصل الثالث">الفصل الثالث</option></select></div>
                    <div class="form-group"><label>النوع</label><select id="sel-type"><option value="فرض">فرض</option><option value="اختبار">اختبار</option><option value="سلسلة تمارين">سلسلة تمارين</option><option value="ملخص">ملخص</option></select></div>
                </div>
                
                <div class="form-group">
                    <label>تحديد المواضيع (ملفات متعددة)</label>
                    <input type="file" id="file-subj" accept="image/*,.pdf,.doc,.docx" multiple onchange="checkFilesCount()">
                </div>
                
                <div class="form-group" id="sol-group">
                    <label>ملف الحل (لموضوع واحد فقط)</label>
                    <input type="file" id="file-sol" accept="image/*,.pdf,.doc,.docx">
                </div>

                <button class="btn btn-submit" id="btn-publish" onclick="publishExamsBulk()"><i class="fa-solid fa-cloud-arrow-up"></i> نشر المواضيع الآن</button>
                <div id="upload-loader"></div>
            </div>
        </div>

        <!-- قسم إدارة طلبات المساهمات والمواضيع المنشورة -->
        <div>
            <!-- طلبات المساهمات الواردة (بشكل أزرار صغيرة وأنيقة) -->
            <div class="panel-card" style="border-color: var(--admin-warning);">
                <div class="panel-header" style="color: var(--admin-warning);"><i class="fa-solid fa-inbox"></i> طلبات المساهمات المعلقة</div>
                <div style="overflow-x: auto;">
                    <table id="requests-table">
                        <thead><tr><th>عنوان الموضوع</th><th>المرسل</th><th>إجراء</th></tr></thead>
                        <tbody id="requests-table-body"><tr><td colspan="3" class="empty-state">جاري التحقق من الطلبات...</td></tr></tbody>
                    </table>
                </div>
            </div>

            <!-- المواضيع المنشورة حالياً -->
            <div class="panel-card">
                <div class="panel-header"><i class="fa-solid fa-database"></i> المواضيع المنشورة في الموقع</div>
                <div style="overflow-x: auto;">
                    <table id="exams-table">
                        <thead><tr><th>العنوان</th><th>المستوى والمادة</th><th>حذف</th></tr></thead>
                        <tbody id="table-body"><tr><td colspan="3" class="empty-state">جاري جلب البيانات...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة تفاصيل ومعاينة الطلب للأدمن -->
    <div id="admin-request-modal" class="admin-modal">
        <div class="admin-modal-card">
            <div class="admin-modal-header">
                <h3 style="color: var(--admin-warning); font-size: 1.1rem;"><i class="fa-solid fa-file-lines"></i> تفاصيل طلب المساهمة</h3>
                <button onclick="closeAdminModal()" style="background:none; border:none; color:white; font-size:1.2rem; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="admin-modal-body" id="admin-modal-content">
                <!-- يتم حقن التفاصيل هنا -->
            </div>
            <div class="admin-modal-footer">
                <button class="btn btn-approve" id="modal-approve-btn"><i class="fa-solid fa-check"></i> قبول ونشر</button>
                <button class="btn btn-delete" id="modal-reject-btn"><i class="fa-solid fa-xmark"></i> رفض وحذف</button>
                <button class="btn" style="background:#4b5563;" onclick="closeAdminModal()">إغلاق</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, getDoc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCu-ZLIqFgvZSEm8KSn7Seh1X9lnHhGSh0", authDomain: "shop-clothes-224a3.firebaseapp.com", projectId: "shop-clothes-224a3", storageBucket: "shop-clothes-224a3.appspot.com", messagingSenderId: "348817058494", appId: "1:348817058494:web:830980b3dae15984350cef" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const TELEGRAM_BOT_TOKEN = "8830778195:AAGqo5LxOHUWwBa4PS6qRM5OS7hSF8aBQVg"; 
        const TELEGRAM_CHANNEL_ID = "7737717483"; 

        const curriculum = {
            'الأولى ثانوي': { 
                'جذع مشترك علوم وتكنولوجيا': ['الرياضيات', 'العلوم الفيزيائية', 'علوم الطبيعة والحياة', 'اللغة العربية وآدابها', 'اللغة الفرنسية', 'اللغة الإنجليزية', 'التاريخ والجغرافيا', 'العلوم الإسلامية', 'التكنولوجيا (هندسة كهربائية)', 'التكنولوجيا (هندسة مدنية)', 'التكنولوجيا (هندسة ميكانيكية)', 'الإعلام الآلي'], 
                'جذع مشترك آداب': ['الرياضيات', 'العلوم الفيزيائية', 'اللغة العربية وآدابها', 'اللغة الفرنسية', 'اللغة الإنجليزية', 'التاريخ والجغرافيا', 'العلوم الإسلامية', 'الإعلام الآلي'] 
            },
            'الثانية ثانوي': { 
                'علوم تجريبية': ['الرياضيات', 'العلوم الفيزيائية', 'علوم الطبيعة والحياة', 'الفلسفة', 'اللغة العربية وآدابها', 'اللغة الفرنسية', 'اللغة الإنجليزية', 'التاريخ والجغرافيا', 'العلوم الإسلامية'], 
                'تقني رياضي': ['الرياضيات', 'العلوم الفيزيائية', 'الهندسة المدنية', 'الهندسة الميكانيكية', 'الهندسة الكهربائية', 'اللغة العربية وآدابها', 'اللغة الفرنسية', 'اللغة الإنجليزية', 'التاريخ والجغرافيا', 'العلوم الإسلامية'], 
                'رياضيات': ['الرياضيات', 'العلوم الفيزيائية', 'علوم الطبيعة والحياة', 'اللغة العربية وآدابها', 'اللغة الفرنسية', 'اللغة الإنجليزية', 'التاريخ والجغرافيا', 'العلوم الإسلامية'], 
                'آداب وفلسفة': ['الرياضيات', 'اللغة العربية وآدابها', 'اللغة الفرنسية', 'اللغة الإنجليزية', 'التاريخ والجغرافيا', 'العلوم الإسلامية', 'الفلسفة'], 
                'لغات أجنبية': ['الرياضيات', 'اللغة العربية وآدابها', 'اللغة الفرنسية', 'اللغة الإنجليزية', 'اللغة الإسبانية', 'اللغة الألمانية', 'التاريخ والجغرافيا', 'العلوم الإسلامية', 'الفلسفة'], 
                'تسيير واقتصاد': ['الرياضيات', 'اللغة العربية وآدابها', 'اللغة الفرنسية', 'اللغة الإنجليزية', 'التاريخ والجغرافيا', 'العلوم الإسلامية', 'التسيير المحاسبي والمالي', 'الاقتصاد والمناجمنت', 'القانون'] 
            },
            'الثالثة ثانوي': { 
                'علوم تجريبية': ['الرياضيات', 'العلوم الفيزيائية', 'علوم الطبيعة والحياة', 'الفلسفة', 'اللغة العربية وآدابها', 'اللغة الفرنسية', 'اللغة الإنجليزية', 'التاريخ والجغرافيا', 'العلوم الإسلامية'] 
            }
        };

        window.updateBranches = function() { const year = document.getElementById('sel-year').value; const branchSel = document.getElementById('sel-branch'); const subjectSel = document.getElementById('sel-subject'); branchSel.innerHTML = '<option value="">-- اختر الشعبة --</option>'; subjectSel.innerHTML = '<option value="">-- اختر المادة --</option>'; subjectSel.disabled = true; if (year && curriculum[year]) { Object.keys(curriculum[year]).forEach(branch => { branchSel.innerHTML += `<option value="${branch}">${branch}</option>`; }); branchSel.disabled = false; } else { branchSel.disabled = true; } };
        window.updateSubjects = function() { const year = document.getElementById('sel-year').value; const branch = document.getElementById('sel-branch').value; const subjectSel = document.getElementById('sel-subject'); subjectSel.innerHTML = '<option value="">-- اختر المادة --</option>'; if (year && branch && curriculum[year][branch]) { curriculum[year][branch].forEach(subject => { subjectSel.innerHTML += `<option value="${subject}">${subject}</option>`; }); subjectSel.disabled = false; } else { subjectSel.disabled = true; } };

        window.checkFilesCount = function() {
            const files = document.getElementById('file-subj').files;
            const solGroup = document.getElementById('sol-group');
            if(files.length > 1) { solGroup.style.display = 'none'; } else { solGroup.style.display = 'block'; }
        };

        async function uploadAndGetFileId(file, caption) {
            const formData = new FormData();
            formData.append('chat_id', TELEGRAM_CHANNEL_ID);
            formData.append('document', file);
            formData.append('caption', caption);
            const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument`, { method: 'POST', body: formData });
            const data = await res.json();
            if (!data.ok) throw new Error(data.description);
            return data.result.document.file_id;
        }

        window.publishExamsBulk = async function() {
            const year = document.getElementById('sel-year').value; 
            const branch = document.getElementById('sel-branch').value; 
            const subject = document.getElementById('sel-subject').value; 
            const term = document.getElementById('sel-term').value; 
            const type = document.getElementById('sel-type').value; 
            const filesSubj = document.getElementById('file-subj').files; 
            const fileSol = document.getElementById('file-sol').files[0];

            if (!year || !branch || !subject || filesSubj.length === 0) return alert("الرجاء اختيار كافة الحقول وتحديد ملف واحد على الأقل!");

            const loader = document.getElementById('upload-loader');
            loader.style.display = 'block';
            document.getElementById('btn-publish').disabled = true;

            try {
                const q = query(collection(db, "exams_repository"), where("year", "==", year), where("branch", "==", branch), where("subject", "==", subject), where("term", "==", term), where("type", "==", type));
                const snapshot = await getDocs(q);
                let currentCount = snapshot.size;

                for (let i = 0; i < filesSubj.length; i++) {
                    const currentFile = filesSubj[i];
                    currentCount++;
                    const autoTitle = `${type} رقم ${currentCount}`;
                    loader.innerHTML = `<i class="fa-solid fa-gear fa-spin"></i> جاري رفع الملف ${i + 1} من ${filesSubj.length}...`;

                    const subjFileId = await uploadAndGetFileId(currentFile, autoTitle);
                    let solFileId = "";
                    if (filesSubj.length === 1 && fileSol) {
                        solFileId = await uploadAndGetFileId(fileSol, autoTitle + " (الحل)");
                    }

                    await addDoc(collection(db, "exams_repository"), { 
                        year, branch, subject, term, type, title: autoTitle, subjectFileId: subjFileId, solutionFileId: solFileId, timestamp: serverTimestamp() 
                    });
                }
                alert(`✅ تم النشر بنجاح!`);
                document.getElementById('file-subj').value = ''; document.getElementById('file-sol').value = '';
                loadAllExams();
            } catch (err) { alert("❌ خطأ: " + err.message); } 
            finally { loader.style.display = 'none'; document.getElementById('btn-publish').disabled = false; }
        };

        // --- جلب وعرض طلبات المساهمات كأزرار صغيرة ---
        async function loadContributionsRequests() {
            const tbody = document.getElementById('requests-table-body');
            try {
                const querySnapshot = await getDocs(collection(db, "contributions_requests"));
                if (querySnapshot.empty) return tbody.innerHTML = '<tr><td colspan="3" class="empty-state">لا توجد طلبات مساهمة معلقة</td></tr>';
                tbody.innerHTML = '';
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    tbody.innerHTML += `
                        <tr>
                            <td><strong style="color:white; font-size:0.9rem;">${data.title}</strong></td>
                            <td style="color:var(--text-muted);">${data.sender}</td>
                            <td>
                                <button class="btn btn-view" onclick="openRequestDetails('${docSnap.id}')"><i class="fa-solid fa-eye"></i> معاينة الطلب</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) { tbody.innerHTML = '<tr><td colspan="3" class="empty-state" style="color:var(--admin-danger);">حدث خطأ في جلب الطلبات</td></tr>'; }
        }

        // فتح نافذة تفاصيل الطلب للأدمن
        window.openRequestDetails = async function(requestId) {
            const modal = document.getElementById('admin-request-modal');
            const content = document.getElementById('admin-modal-content');
            content.innerHTML = '<div style="text-align:center; padding:2rem;"><i class="fa-solid fa-circle-notch fa-spin" style="font-size:2rem; color:var(--admin-primary);"></i></div>';
            modal.classList.add('show');

            try {
                const reqDoc = await getDoc(doc(db, "contributions_requests", requestId));
                if(!reqDoc.exists()) return content.innerHTML = '<p>الطلب غير موجود</p>';
                const data = reqDoc.data();

                let subUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getFile?file_id=${data.subjectFileId}`;
                let res = await fetch(subUrl);
                let resData = await res.json();
                let directSubUrl = resData.ok ? `https://api.telegram.org/file/bot${TELEGRAM_BOT_TOKEN}/${resData.result.file_path}` : '#';

                content.innerHTML = `
                    <div class="detail-row"><span>المرسل:</span> ${data.sender}</div>
                    <div class="detail-row"><span>عنوان الموضوع:</span> <strong style="color:white;">${data.title}</strong></div>
                    <div class="detail-row"><span>المستوى الدراسي:</span> ${data.year} - ${data.branch}</div>
                    <div class="detail-row"><span>المادة:</span> ${data.subject}</div>
                    <div class="detail-row"><span>التصنيف والفصل:</span> ${data.type} (${data.term})</div>
                    <div style="margin-top: 1.5rem; display:flex; gap:10px; flex-wrap:wrap;">
                        <a href="${directUrl}" target="_blank" class="btn btn-submit" style="margin:0; text-decoration:none;"><i class="fa-solid fa-file-pdf"></i> معاينة ملف الموضوع (PDF / صورة)</a>
                    </div>
                `;

                // ربط أزرار القبول والرفض داخل النافذة
                document.getElementById('modal-approve-btn').onclick = () => approveRequest(requestId);
                document.getElementById('modal-reject-btn').onclick = () => deleteRequest(requestId);

            } catch(e) {
                content.innerHTML = `<p style="color:var(--admin-danger);">تعذر جلب تفاصيل الملف: ${e.message}</p>`;
            }
        };

        window.closeAdminModal = function() {
            document.getElementById('admin-request-modal').classList.remove('show');
        };

        window.approveRequest = async function(requestId) {
            if(!confirm("هل أنت متأكد من قبول ونشر هذا الموضوع في الموقع العام؟")) return;
            try {
                const reqDocRef = doc(db, "contributions_requests", requestId);
                const reqSnap = await getDoc(reqDocRef);
                if (!reqSnap.exists()) return;
                
                const data = reqSnap.data();

                await addDoc(collection(db, "exams_repository"), {
                    year: data.year,
                    branch: data.branch,
                    subject: data.subject,
                    term: data.term,
                    type: data.type,
                    title: data.title,
                    subjectFileId: data.subjectFileId, 
                    solutionFileId: data.solutionFileId || "",
                    timestamp: serverTimestamp()
                });

                await deleteDoc(reqDocRef);
                closeAdminModal();
                alert("✅ تم قبول ونشر الموضوع بنجاح ليعرض للطلاب فوراً!");
                loadContributionsRequests();
                loadAllExams();
            } catch (err) {
                alert("❌ خطأ أثناء القبول: " + err.message);
            }
        };

        window.deleteRequest = async function(requestId) {
            if(confirm("هل تريد رفض وحذف هذا الطلب نهائياً؟")) {
                try {
                    await deleteDoc(doc(db, "contributions_requests", requestId));
                    closeAdminModal();
                    loadContributionsRequests();
                } catch(e) { alert("خطأ: " + e.message); }
            }
        };

        async function loadAllExams() {
            const tbody = document.getElementById('table-body');
            try {
                const querySnapshot = await getDocs(collection(db, "exams_repository"));
                if (querySnapshot.empty) return tbody.innerHTML = '<tr><td colspan="3" class="empty-state">لا توجد مواضيع منشورة</td></tr>';
                tbody.innerHTML = '';
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight:bold; color:white;">${data.title}</td>
                            <td><span style="font-size:0.8rem; display:block; color:var(--admin-primary);">${data.year} - ${data.branch}</span>${data.subject}</td>
                            <td><button class="btn btn-delete" onclick="deleteExam('${docSnap.id}')"><i class="fa-solid fa-trash"></i> حذف</button></td>
                        </tr>
                    `;
                });
            } catch (error) { tbody.innerHTML = '<tr><td colspan="3" class="empty-state" style="color:var(--admin-danger);">حدث خطأ</td></tr>'; }
        }

        window.deleteExam = async function(id) { if (confirm("هل أنت متأكد من الحذف النهائي؟")) { try { await deleteDoc(doc(db, "exams_repository", id)); loadAllExams(); } catch (error) { alert("خطأ: " + error.message); } } };
        
        window.onload = function() {
            loadAllExams();
            loadContributionsRequests();
        };
    </script>
</body>
</html>
