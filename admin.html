<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - الربط المباشر مع تليجرام</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* نفس تصميم لوحة الإدارة السابق دون تغيير */
        :root { --admin-dark: #111827; --admin-panel: #1f2937; --admin-primary: #3b82f6; --admin-accent: #10b981; --admin-danger: #ef4444; --text-light: #f3f4f6; --text-muted: #9ca3af; --border-color: #374151; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--admin-dark); color: var(--text-light); line-height: 1.6; padding-bottom: 50px; }
        header { background: var(--admin-panel); padding: 1.2rem 2rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 10px; } .brand i { color: var(--admin-primary); }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
        .panel-card { background: var(--admin-panel); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; }
        .panel-header { font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; } .panel-header i { color: var(--admin-accent); }
        .form-group { margin-bottom: 1rem; } .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; background: #374151; border: 1px solid #4b5563; color: white; border-radius: 8px; font-size: 0.95rem; }
        .form-row { display: flex; gap: 10px; } .form-row .form-group { flex: 1; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: white; margin-top: 1rem; }
        .btn-submit { background: var(--admin-primary); } .btn-delete { background: var(--admin-danger); padding: 6px 12px; font-size: 0.85rem; margin-top: 0; width: auto;}
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; } th, td { text-align: right; padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; } th { background: rgba(0,0,0,0.2); color: var(--text-muted); }
        .empty-state { text-align: center; padding: 2rem; color: var(--text-muted); }
        #upload-loader { display: none; text-align: center; padding: 1rem; color: var(--admin-accent); font-weight: 700; background: rgba(16, 185, 129, 0.1); border-radius: 8px; margin-top: 1rem; border: 1px solid rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body>
    <header>
        <div class="brand"><i class="fa-solid fa-shield-halved"></i> لوحة الإدارة - ثانوية غوبريني مصطفى</div>
        <div style="font-size: 0.9rem; color: var(--admin-accent); font-weight: 700;">الأدمن: يوسف</div>
    </header>

    <div class="container">
        <div class="panel-card">
            <div class="panel-header"><i class="fa-solid fa-plus-circle"></i> إضافة موضوع (مستضاف على تليجرام)</div>
            <div class="form-group"><label>السنة الدراسية</label><select id="sel-year" onchange="updateBranches()"><option value="">-- اختر السنة --</option><option value="الأولى ثانوي">الأولى ثانوي</option><option value="الثانية ثانوي">الثانية ثانوي</option><option value="الثالثة ثانوي">الثالثة ثانوي</option></select></div>
            <div class="form-group"><label>الشعبة</label><select id="sel-branch" onchange="updateSubjects()" disabled><option value="">-- اختر الشعبة --</option></select></div>
            <div class="form-group"><label>المادة</label><select id="sel-subject" disabled><option value="">-- اختر المادة --</option></select></div>
            <div class="form-row">
                <div class="form-group"><label>الفصل</label><select id="sel-term"><option value="الفصل الأول">الفصل الأول</option><option value="الفصل الثاني">الفصل الثاني</option><option value="الفصل الثالث">الفصل الثالث</option></select></div>
                <div class="form-group"><label>النوع</label><select id="sel-type"><option value="فرض">فرض</option><option value="اختبار">اختبار</option><option value="سلسلة تمارين">سلسلة تمارين</option><option value="ملخص">ملخص</option></select></div>
            </div>
            <div class="form-group"><label>عنوان الموضوع</label><input type="text" id="inp-title" placeholder="مثال: فرض الفصل الأول محروس رقم 1"></div>
            <div class="form-group"><label>ملف الموضوع (إجباري)</label><input type="file" id="file-subj" accept="image/*,.pdf,.doc,.docx"></div>
            <div class="form-group"><label>ملف الحل (اختياري)</label><input type="file" id="file-sol" accept="image/*,.pdf,.doc,.docx"></div>
            <button class="btn btn-submit" onclick="publishExam()"><i class="fa-solid fa-cloud-arrow-up"></i> رفع لتليجرام ونشر الموضوع</button>
            <div id="upload-loader"><i class="fa-solid fa-gear fa-spin"></i> جاري الرفع إلى خوادم تليجرام واستخراج الـ ID...</div>
        </div>

        <div class="panel-card">
            <div class="panel-header"><i class="fa-solid fa-database"></i> إدارة المواضيع</div>
            <div style="overflow-x: auto;">
                <table id="exams-table">
                    <thead><tr><th>العنوان</th><th>المستوى والمادة</th><th>حالة الملف</th><th>إجراءات</th></tr></thead>
                    <tbody id="table-body"><tr><td colspan="4" class="empty-state">جاري جلب البيانات...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCu-ZLIqFgvZSEm8KSn7Seh1X9lnHhGSh0", authDomain: "shop-clothes-224a3.firebaseapp.com", projectId: "shop-clothes-224a3", storageBucket: "shop-clothes-224a3.appspot.com", messagingSenderId: "348817058494", appId: "1:348817058494:web:830980b3dae15984350cef" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const TELEGRAM_BOT_TOKEN = "8830778195:AAGqo5LxOHUWwBa4PS6qRM5OS7hSF8aBQVg"; 
        const TELEGRAM_CHANNEL_ID = "7737717483"; 

        const curriculum = {
            'الأولى ثانوي': { 'جذع مشترك علوم وتكنولوجيا': ['الرياضيات', 'العلوم الفيزيائية', 'علوم الطبيعة والحياة', 'اللغة العربية وآدابها', 'اللغة الفرنسية', 'اللغة الإنجليزية', 'التاريخ والجغرافيا', 'العلوم الإسلامية', 'التكنولوجيا', 'الإعلام الآلي'], 'جذع مشترك آداب': ['الرياضيات', 'العلوم الفيزيائية', 'اللغة العربية وآدابها', 'اللغة الفرنسية', 'اللغة الإنجليزية', 'التاريخ والجغرافيا', 'العلوم الإسلامية', 'الإعلام الآلي'] },
            'الثانية ثانوي': { 'علوم تجريبية': ['الرياضيات', 'العلوم الفيزيائية', 'علوم الطبيعة والحياة', 'اللغة العربية وآدابها', 'اللغة الفرنسية', 'اللغة الإنجليزية', 'التاريخ والجغرافيا', 'العلوم الإسلامية'], 'تقني رياضي': ['الرياضيات', 'العلوم الفيزيائية', 'الهندسة المدنية', 'الهندسة الميكانيكية', 'الهندسة الكهربائية', 'هندسة الطرائق', 'اللغة العربية وآدابها', 'اللغة الفرنسية', 'اللغة الإنجليزية', 'التاريخ والجغرافيا', 'العلوم الإسلامية'] },
            'الثالثة ثانوي': { 'علوم تجريبية': ['الرياضيات', 'العلوم الفيزيائية', 'علوم الطبيعة والحياة', 'الفلسفة', 'اللغة العربية وآدابها', 'اللغة الفرنسية', 'اللغة الإنجليزية', 'التاريخ والجغرافيا', 'العلوم الإسلامية'] }
        };

        window.updateBranches = function() { const year = document.getElementById('sel-year').value; const branchSel = document.getElementById('sel-branch'); const subjectSel = document.getElementById('sel-subject'); branchSel.innerHTML = '<option value="">-- اختر الشعبة --</option>'; subjectSel.innerHTML = '<option value="">-- اختر المادة --</option>'; subjectSel.disabled = true; if (year && curriculum[year]) { Object.keys(curriculum[year]).forEach(branch => { branchSel.innerHTML += `<option value="${branch}">${branch}</option>`; }); branchSel.disabled = false; } else { branchSel.disabled = true; } };
        window.updateSubjects = function() { const year = document.getElementById('sel-year').value; const branch = document.getElementById('sel-branch').value; const subjectSel = document.getElementById('sel-subject'); subjectSel.innerHTML = '<option value="">-- اختر المادة --</option>'; if (year && branch && curriculum[year][branch]) { curriculum[year][branch].forEach(subject => { subjectSel.innerHTML += `<option value="${subject}">${subject}</option>`; }); subjectSel.disabled = false; } else { subjectSel.disabled = true; } };

        // رفع الملف كـ Document وجلب الـ File ID السري
        async function uploadAndGetFileId(file, caption) {
            const formData = new FormData();
            formData.append('chat_id', TELEGRAM_CHANNEL_ID);
            formData.append('document', file);
            formData.append('caption', caption);

            const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument`, {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.description);
            
            // إرجاع معرّف الملف السري (File ID) الذي سنحفظه في القاعدة
            return data.result.document.file_id;
        }

        window.publishExam = async function() {
            const year = document.getElementById('sel-year').value; const branch = document.getElementById('sel-branch').value; const subject = document.getElementById('sel-subject').value; const term = document.getElementById('sel-term').value; const type = document.getElementById('sel-type').value; const title = document.getElementById('inp-title').value; const fileSubj = document.getElementById('file-subj').files[0]; const fileSol = document.getElementById('file-sol').files[0];
            if (!year || !branch || !subject || !title || !fileSubj) return alert("الرجاء ملء جميع الحقول وإرفاق الموضوع!");

            document.getElementById('upload-loader').style.display = 'block';

            try {
                const metaText = `📁 رفع: ${title}\nالمادة: ${subject} (${year} - ${branch})\n${type} - ${term}`;
                
                // جلب الـ ID للموضوع
                const subjFileId = await uploadAndGetFileId(fileSubj, metaText + "\n(الموضوع)");
                
                // جلب الـ ID للحل إن وجد
                let solFileId = "";
                if (fileSol) solFileId = await uploadAndGetFileId(fileSol, metaText + "\n(الحل)");

                // حفظ الـ IDs في قاعدة البيانات بدلاً من الروابط
                await addDoc(collection(db, "exams_repository"), { 
                    year: year, branch: branch, subject: subject, term: term, type: type, title: title, 
                    subjectFileId: subjFileId, // لاحظ التغيير هنا
                    solutionFileId: solFileId, // وهنا
                    timestamp: serverTimestamp() 
                });
                
                alert("✅ تم الرفع على خوادم تليجرام وحفظ الـ File ID بنجاح!");
                document.getElementById('inp-title').value = ''; document.getElementById('file-subj').value = ''; document.getElementById('file-sol').value = '';
                loadAllExams();
            } catch (err) { alert("❌ خطأ: " + err.message); } finally { document.getElementById('upload-loader').style.display = 'none'; }
        };

        async function loadAllExams() {
            const tbody = document.getElementById('table-body');
            try {
                const querySnapshot = await getDocs(collection(db, "exams_repository"));
                if (querySnapshot.empty) return tbody.innerHTML = '<tr><td colspan="4" class="empty-state">لا توجد مواضيع</td></tr>';
                tbody.innerHTML = '';
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight:bold; color:white;">${data.title}</td>
                            <td><span style="font-size:0.8rem; display:block; color:var(--admin-primary);">${data.year} - ${data.branch}</span>${data.subject}</td>
                            <td><span style="color:var(--admin-accent); font-size:0.8rem;">مربوط بـ Telegram API</span></td>
                            <td><button class="btn btn-delete" onclick="deleteExam('${docSnap.id}')"><i class="fa-solid fa-trash"></i> حذف</button></td>
                        </tr>
                    `;
                });
            } catch (error) { tbody.innerHTML = '<tr><td colspan="4" class="empty-state" style="color:var(--admin-danger);">حدث خطأ</td></tr>'; }
        }

        window.deleteExam = async function(id) { if (confirm("هل أنت متأكد من الحذف؟")) { try { await deleteDoc(doc(db, "exams_repository", id)); loadAllExams(); } catch (error) { alert("خطأ: " + error.message); } } };
        window.onload = loadAllExams;
    </script>
</body>
</html>
